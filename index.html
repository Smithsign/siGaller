<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #ff8c00;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        
        .title {
            color: white;
            font-size: 40px;
            margin-bottom: 40px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        .product-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-box {
            background: linear-gradient(145deg, #ffffff, #f5f5f5);
            border: 4px solid #222;
            border-radius: 15px;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0px 8px 18px rgba(0,0,0,0.3);
            padding: 15px;
            transition: all 0.3s ease;
        }

        .product-box:hover {
            transform: translateY(-5px);
            box-shadow: 0px 12px 25px rgba(0,0,0,0.4);
            border-color: #ffb84d;
        }
        
        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .product-label {
            text-align: center;
            margin-top: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1 class="title">GALLERY</h1>
    
    <div class="container">
        <div class="product-item">
            <div class="product-box"><img src="watch.png" alt="Watch" class="product-image"></div>
            <div class="product-label">Orange Watch</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="tumbler.png" alt="Tumbler" class="product-image"></div>
            <div class="product-label">Tumbler</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="chair.png" alt="Chair" class="product-image"></div>
            <div class="product-label">siChair</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="tote.png" alt="siTOTE" class="product-image"></div>
            <div class="product-label">siTOTE</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="mouse.png" alt="siMOUSE" class="product-image"></div>
            <div class="product-label">siMOUSE</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="pants.png" alt="siPANTS" class="product-image"></div>
            <div class="product-label">siPANTS</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="rug.png" alt="siRug" class="product-image"></div>
            <div class="product-label">siRug</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="pen.png" alt="siPEN" class="product-image"></div>
            <div class="product-label">siPEN</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="band.png" alt="siBand" class="product-image"></div>
            <div class="product-label">siBand</div>
        </div>

        <div class="product-item">
            <div class="product-box"><img src="case.png" alt="siCASE" class="product-image"></div>
            <div class="product-label">siCASE</div>
        </div>
        
         <div class="product-item">
            <div class="product-box"><img src="mug.png" alt="siMUG" class="product-image"></div>
            <div class="product-label">siMUG</div>
        </div>

          <div class="product-item">
            <div class="product-box"><img src="cap.png" alt="siCAP" class="product-image"></div>
            <div class="product-label">siCAP</div>
        </div>
    </div>
</body>
</html>
